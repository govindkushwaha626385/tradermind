<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Candlesticks & Bullish Trend Wave -->
  <!-- Left Candlestick -->
  <line x1="168" y1="210" x2="168" y2="330" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <rect x="156" y="240" width="24" height="60" rx="6" fill="#3b82f6" opacity="0.8"/>

  <!-- Center-Right Candlestick (Bullish) -->
  <line x1="344" y1="140" x2="344" y2="310" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <rect x="332" y="170" width="24" height="90" rx="6" fill="url(#greenGrad)"/>

  <!-- Central "T & M" Hexagonal Monogram / Growth Vector -->
  <g filter="url(#glow)">
    <!-- Dynamic Ascending Path -->
    <path d="M140 330 L220 240 L280 290 L380 160" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Peak Arrow Marker -->
    <circle cx="380" cy="160" r="14" fill="#ec4899"/>
    <circle cx="380" cy="160" r="24" fill="#ec4899" opacity="0.3"/>
  </g>

  <!-- Modern Central 'T' Mark -->
  <path d="M 216 170 L 296 170 M 256 170 L 256 340" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>

  <!-- Subtle Subtitle Text -->
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="8" text-anchor="middle">TRADEMIND</text>
</svg>
