version: '3.8'

services:
  # ── API Server ───────────────────────────────────
  # TradeMind uses Supabase as the single source of truth for ALL data:
  #   • Primary Postgres database (Auth + Data)
  #   • Cache (cache_entries table)
  #   • Job Queue (background_jobs table, FOR UPDATE SKIP LOCKED)
  #   • Rate Limiting (api_rate_limits table, atomic UPSERT)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trademind-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      # ── Database: Supabase-hosted Postgres (primary) ──
      # The connection string from Supabase SQL Editor → Connection Settings.
      # Format: postgresql://postgres.XXXX:password@aws-0-XX.pooler.supabase.com:6543/postgres
      DATABASE_URL: ${SUPABASE_DATABASE_URL}

      # ── Supabase Auth (Admin/service-role) ─────────
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
    ports:
      - "4000:4000"

  # ── Web Frontend ─────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: trademind-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api
